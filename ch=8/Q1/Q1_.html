<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Alerts</title>
</head>
<body>
    <button onclick="showAlert1()">Button 1</button>
    <button onclick="showAlert2()">Button 2</button>
    <button onclick="showAlert3()">Button 3</button>

    <script>
        function showAlert1() {
            alert("You are clicked button 1!");
        }
        function showAlert2() {
            alert("You are clicked button 2!");
        }
        function showAlert3() {
            alert("You are clicked button 3!");
        }
    </script>
    
</body>
</html>
