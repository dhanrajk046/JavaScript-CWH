<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .clock {
            margin-bottom: 20px;
            font-size: 24px;
            color: #9ca3af;
        }

        #time {
            margin-top: 15px;
            font-size: 18px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="clock">
        <h1>Digital Clock</h1>

        <div id="time">00:00:00</div>

        <div id="date">Loading...</div>
    </div>
    
    <script>
        function updateClock() {
            
            // Create Date object
            let now = new Date();

            // Get hours, minutes and seconds
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            //Add 0 before single digit values
            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            // Display time
            document.getElementById("time").innerHTML = `${hours}:${minutes}:${seconds}`;

            // Get and display date
            document.getElementById("date").innerHTML = now.toDateString();
        }

        // Run immediately
        updateClock();

        // Update clock every 1 second
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
<!-- 
// How it works - 5 points

// 1. new Date() creates a Date object containing the current date and time.

// 2. getHours(), getMinutes(), and getSeconds() get the current hours, minutes, and seconds.

// 3. padStart(2,"0") makes values like 5 appear as 05.

// 4. setInterval(updateClock, 1000) calls updateClock() every 1000 milliseconds (1 second).

// 5. innerHTML updates the <div> with the latest time, so the clock continuously changes every second.
     -->
