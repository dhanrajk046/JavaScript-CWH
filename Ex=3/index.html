<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100 vh;
        }

        #joke {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div id="joke"></div>

    <script>
        // Array containing 10 jokes
        let jokes = [
            "Why do programmers prefer dark mode? Because light attracts bugs.",
            "Why did the developer go broke? Because he used up all his cache.",
            "How do you comfort a JavaScript bug? You console it.",
            "Why do Java developers wear glasses? Because they don't C#.",
            "Why did the function break up with the variable? It had too many issues.",
            "How many programmers does it take to change a light bulb? None, that's a hardware problem.",
            "Why did the computer keep freezing? It saw a Windows update.",
            "What did the SQL query say to the database? Fetch me.",
            "Why was the math book sad? It had too many problems.",
            "Why do developers hate nature? It has too many bugs."
        ];

        // Generate a random index
        let randomIndex = Math.floor(Math.random() * jokes.length);
        
        // Display the random joke inside the div

        document.getElementById("joke").innerHTML = jokes[randomIndex];
    </script>
</body>

</html>

<!-- // How it works - 5 points

// 1. Jokes array: An array named jokes contains 10 different jokes, satisfying the minimum requirements.

// 2. Math.random(): It generates a random decimal between 0 and 1.

// 3. Random index: Math.floor(Math.random() * jokes.length) converts it into a valid array index from 0 to 9.

// 4. innerHTML: document.getElementById("joke").innerHTML puts the selected joke inside the <div>. 
    
// 5. Every reload: The JavaScript runs again when the page reloads, generating another random index, so a random joke is displayed each time. 

Note: The exercise says to "fetch jokes from the internet"; the jokes above are included directly in the array so the program works without depending on an external API. If your teacher spesifically requires jokes to be fetched from an online API, it will be a different version from this.-->
